<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Recommender System</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-image"></div>

    <div class="container">
        <header>
        

            <h1>Anime Recommender System</h1>
            <p class="subtitle">Discover your next favorite anime!</p>
        </header>

        <main>
            <form action="/" method="POST" class="recommendation-form">
                <label for="user_id">Enter Your User ID:</label>
                <input type="number" id="user_id" name="user_id" required>
                <button type="submit">🎌 Get Recommendations</button>
            </form>

            {% if recommendations %}
                <section class="results">
                    <h2>Your Anime Recommendations</h2>
                    <ul>
                        {% for anime in recommendations %}
                            <li>{{ anime }}</li>
                        {% endfor %}
                    </ul>
                </section>
            {% endif %}
        </main>
    </div>
</body>
</html>
